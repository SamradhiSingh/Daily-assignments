
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase | Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">ShopEase.</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#categories">Categories</a>
            <a href="#cart">My Cart 🛒</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <div>
            <p class="tagline">YOUR EVERYDAY SHOPPING DESTINATION</p>
            <h1>Find What You Love.</h1>
            <p>Explore our collection and shop your favourites.</p>
            <a href="#products" class="shop-btn">Shop Now</a>
        </div>
    </section>

    <section class="section" id="categories">
        <h2>Shop by Category</h2>
        <div id="category-list" class="category-list"></div>
    </section>

    <section class="section" id="products">
        <h2>Our Products</h2>
        <div id="product-list" class="product-list"></div>
    </section>

    <section class="section cart-section" id="cart">
        <h2>My Shopping Cart 🛒</h2>

        <div id="cart-items"></div>

        <div class="cart-summary">
            <h3 id="cart-total">Total: ₹0</h3>
        </div>
    </section>

    <section class="section checkout-section">
        <h2>Checkout</h2>

        <form id="checkout-form">
            <label for="address">Delivery Address</label>
            <textarea
                id="address"
                placeholder="Enter your complete delivery address"
                required
            ></textarea>

            <button type="submit">Place Order</button>
        </form>

        <div id="order-message"></div>
    </section>

    <footer>
        <p>© 2026 ShopEase. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
